<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Bookmarks - UIU Question Bank</title>
    <link href="css/all.css" rel="stylesheet">
    <link href="css/style.css?v=lms" rel="stylesheet">
    <script src="js/jquery.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="sidebar">
            <div class="logo-area">
                <i class="fas fa-layer-group"></i> UIU QB
            </div>
            <nav class="sidebar-menu">
                <a href="index.html" class="menu-item"><i class="fas fa-home"></i> Home</a>
                <a href="courses.html" class="menu-item"><i class="fas fa-book"></i> Courses</a>
                <a href="mycourses.html" class="menu-item active"><i class="fas fa-bookmark"></i> Bookmarks</a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="app-main">
            <!-- Topbar -->
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="menu-toggle" id="openMenu"><i class="fas fa-bars"></i></button>
                    <div class="mobile-logo"><i class="fas fa-layer-group"></i> UIU QB</div>
                </div>
                <div class="topbar-right"></div>
            </header>

            <!-- Scrollable Content -->
            <div class="app-content">
                <div class="section-header">
                    <h3>My Bookmarked Courses</h3>
                    <button class="btn-see-all" id="back" style="background: var(--surface); border: 1px solid var(--border);"><i class="fas fa-arrow-left"></i> Back</button>
                </div>

                <div class="courseBoxContainer" id="courseBoxContainer">
                    <!-- JS Injected Cards -->
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarMenuBackground"></div>

    <script src="js/mycourses.js?v=lms"></script>
</body>
</html>
